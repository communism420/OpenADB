version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
    groups:
      pyside6-stack:
        applies-to: version-updates
        patterns:
          - pyside6
          - pyside6-essentials
          - pyside6-addons
          - shiboken6
      python-build-toolchain:
        applies-to: version-updates
        patterns:
          - setuptools
          - wheel
          - packaging
          - pyinstaller
          - pyinstaller-hooks-contrib
          - altgraph
          - pefile
          - pywin32-ctypes
      pyside6-stack-security:
        applies-to: security-updates
        patterns:
          - pyside6
          - pyside6-essentials
          - pyside6-addons
          - shiboken6
      python-build-toolchain-security:
        applies-to: security-updates
        patterns:
          - setuptools
          - wheel
          - packaging
          - pyinstaller
          - pyinstaller-hooks-contrib
          - altgraph
          - pefile
          - pywin32-ctypes

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
