name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Python ${{ matrix.python-version }} / Windows
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: "qt.qpa.*=false"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt

      - name: Install reproducible development dependencies
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Development dependency installation failed."
          }
          python -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "The development dependency environment is inconsistent."
          }

      - name: Check committed whitespace
        shell: pwsh
        run: |
          git diff --check
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $base = git merge-base HEAD "origin/$env:GITHUB_BASE_REF"
            git diff --check "$base...HEAD"
          }
          else {
            git diff --check HEAD^ HEAD
          }

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q openadb tests tools

      - name: Run Ruff
        shell: pwsh
        run: python -m ruff check openadb tests tools

      - name: Check version consistency
        shell: pwsh
        run: python -m unittest -q tests.test_version_metadata

      - name: Check bundled ACBridge APK metadata
        shell: pwsh
        run: >-
          python -m unittest -q
          tests.test_version_metadata.VersionMetadataTests.test_bundled_apks_are_current_signed_artifacts_with_pinned_legal_snapshot

      - name: Check PyInstaller spec imports
        shell: pwsh
        run: >-
          python -c "from pathlib import Path;
          compile(Path('OpenADB.spec').read_text(encoding='utf-8'), 'OpenADB.spec', 'exec');
          from PyInstaller.utils.hooks import collect_all;
          from openadb.version import ACBRIDGE_APK_FILENAME, RELEASE_EXE_FILENAME;
          assert callable(collect_all);
          assert ACBRIDGE_APK_FILENAME == 'ACBridge-3.1.0.apk';
          assert RELEASE_EXE_FILENAME == 'OpenADB-3.1.0.exe'"

      - name: Check repository privacy guardrails
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import os
          import re
          import subprocess
          from pathlib import Path

          from PIL import Image

          root = Path.cwd()
          tracked_names = subprocess.check_output(
              ["git", "ls-files", "-z"],
          ).decode("utf-8").split("\0")
          untracked_names = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"],
          ).decode("utf-8").split("\0")
          repository_files = [
              root / item
              for item in sorted({*tracked_names, *untracked_names} - {""})
          ]

          private_roots = {
              value.casefold().replace("\\", "/").rstrip("/")
              for value in (os.environ.get("USERPROFILE"), str(Path.home()))
              if value
          }
          private_windows_path = re.compile(
              r"[a-z]:[/\\]users[/\\]([^/\\\s<>\"']+)",
              re.IGNORECASE,
          )
          private_posix_path = re.compile(
              r"/(?:home|users)/([a-z0-9._-]{3,})(?:[/\\]|$)",
              re.IGNORECASE,
          )
          private_ipv4 = re.compile(
              r"(?<![\w.])(?:10(?:\.\d{1,3}){3}|"
              r"192\.168(?:\.\d{1,3}){2}|"
              r"172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})(?![\w.])",
          )
          private_ipv6 = re.compile(
              r"(?<![0-9a-f:])(?:f[cd][0-9a-f]{2}|fe[89ab][0-9a-f]):"
              r"[0-9a-f:]{2,39}(?![0-9a-f:])",
              re.IGNORECASE,
          )
          documented_private_ipv4_placeholders = {"192.168.1.42"}
          findings: list[str] = []
          placeholder_accounts = {"example", "public", "runner", "runneradmin"}
          forbidden_cache_names = {"androguard.db", "androguard.db-shm", "androguard.db-wal"}
          forbidden_secret_suffixes = {
              ".jks",
              ".key",
              ".keystore",
              ".p12",
              ".p8",
              ".pem",
              ".pfx",
              ".pk8",
          }

          for path in repository_files:
              relative_path = path.relative_to(root)
              if path.name.casefold() in forbidden_cache_names:
                  findings.append(f"{relative_path} is a generated Androguard cache")
              if path.suffix.casefold() in forbidden_secret_suffixes:
                  findings.append(f"{relative_path} is private signing/key material")
              try:
                  raw = path.read_bytes()
              except OSError as exc:
                  findings.append(f"{relative_path} could not be privacy-scanned: {type(exc).__name__}")
                  continue
              decoded_variants = {
                  raw.decode("utf-8", errors="ignore"),
                  raw.decode("utf-16-le", errors="ignore"),
                  raw.decode("utf-16-be", errors="ignore"),
              }
              for content in decoded_variants:
                  normalized = content.casefold().replace("\\", "/")
                  for private_root in private_roots:
                      if private_root and private_root in normalized:
                          findings.append(f"{relative_path} contains the CI user profile path")
                  private_usernames = {
                      match.group(1).casefold()
                      for match in private_windows_path.finditer(content)
                      if match.group(1).casefold() not in placeholder_accounts
                  }
                  private_usernames.update(
                      match.group(1).casefold()
                      for match in private_posix_path.finditer(content)
                      if match.group(1).casefold() not in placeholder_accounts
                  )
                  if private_usernames:
                      findings.append(
                          f"{relative_path} contains a non-placeholder user profile path"
                      )
                  private_addresses = {
                      match.group(0) for match in private_ipv4.finditer(content)
                  } - documented_private_ipv4_placeholders
                  if private_addresses:
                      findings.append(f"{relative_path} contains a private IPv4 address")
                  if private_ipv6.search(content):
                      findings.append(f"{relative_path} contains a private IPv6 address")

          private_metadata = re.compile(
              r"(?:[a-z]:[/\\]users[/\\][^/\\\s]+|"
              r"/(?:home|users)/[^/\\\s]+|"
              r"(?<![\w.])(?:10(?:\.\d{1,3}){3}|"
              r"192\.168(?:\.\d{1,3}){2}|"
              r"172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})(?![\w.]))",
              re.IGNORECASE,
          )
          for path in repository_files:
              if path.suffix.casefold() != ".png" or "docs/screenshots" not in path.as_posix():
                  continue
              with Image.open(path) as image:
                  metadata = "\n".join(str(value) for value in image.info.values())
                  if image.getexif():
                      findings.append(f"{path.relative_to(root)} contains EXIF metadata")
                  unexpected_metadata = set(image.info) - {"dpi"}
                  if unexpected_metadata:
                      findings.append(
                          f"{path.relative_to(root)} contains unexpected PNG metadata"
                      )
              if private_metadata.search(metadata):
                  findings.append(f"{path.relative_to(root)} contains private-looking PNG metadata")
              if private_ipv6.search(metadata):
                  findings.append(f"{path.relative_to(root)} contains private IPv6 PNG metadata")

          if findings:
              raise SystemExit("Private demo data check failed:\n- " + "\n- ".join(findings))
          print(f"Privacy guardrails checked {len(repository_files)} repository files.")
          '@ | python -

      - name: Run offscreen GUI smoke tests
        shell: pwsh
        run: >-
          python -W error::ResourceWarning -m unittest -q
          tests.test_final_regressions
          tests.test_design_system
          tests.test_system_theme

      - name: Run full unittest suite in clean-process shards
        id: full-tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $logPath = "test-results/unittest-python-${{ matrix.python-version }}.log"
          $testFiles = @(
            git ls-files "tests/test_*.py" |
              Where-Object { $_ -match '^tests/test_[^/]+\.py$' } |
              Sort-Object
          )
          if ($testFiles.Count -eq 0) {
            throw "No unittest modules were discovered."
          }

          $adaptiveModule = "tests.test_main_window_adaptive"
          $adaptiveDiscovery = @'
          import unittest

          from tests.test_main_window_adaptive import AdaptiveMainWindowTests

          prefix = "tests.test_main_window_adaptive.AdaptiveMainWindowTests."
          for name in unittest.defaultTestLoader.getTestCaseNames(AdaptiveMainWindowTests):
              print(prefix + name)
          '@
          $boundedCaseRunner = @'
          import subprocess
          import sys

          test_case = sys.argv[1]
          command = [
              sys.executable,
              "-W",
              "error::ResourceWarning",
              "-m",
              "unittest",
              "-q",
              test_case,
          ]
          try:
              result = subprocess.run(command, timeout=180, check=False)
          except subprocess.TimeoutExpired:
              print(f"Timed out after 180 seconds: {test_case}", file=sys.stderr)
              raise SystemExit(124)
          raise SystemExit(result.returncode)
          '@

          $failedModules = @()
          foreach ($testFile in $testFiles) {
            if (-not (Test-Path -LiteralPath $testFile -PathType Leaf)) {
              throw "Tracked unittest module is missing: $testFile"
            }
            $module = ($testFile -replace '\.py$', '') -replace '[/\\]', '.'
            "=== $module ===" | Tee-Object -FilePath $logPath -Append
            if ($module -eq $adaptiveModule) {
              $testCases = @(python -c $adaptiveDiscovery 2>&1)
              if ($LASTEXITCODE -ne 0 -or $testCases.Count -eq 0) {
                $testCases | Tee-Object -FilePath $logPath -Append
                $failedModules += "$module (discovery)"
                continue
              }
              foreach ($testCase in $testCases) {
                "=== $testCase ===" | Tee-Object -FilePath $logPath -Append
                python -c $boundedCaseRunner $testCase 2>&1 |
                  Tee-Object -FilePath $logPath -Append
                $caseExitCode = $LASTEXITCODE
                if ($caseExitCode -ne 0) {
                  $failedModules += $testCase
                }
                if ($caseExitCode -eq 124) {
                  break
                }
              }
              continue
            }
            python -W error::ResourceWarning -m unittest -q $module 2>&1 |
              Tee-Object -FilePath $logPath -Append
            $moduleExitCode = $LASTEXITCODE
            if ($moduleExitCode -ne 0) {
              $failedModules += $module
            }
          }

          if ($failedModules.Count -ne 0) {
            Write-Error ("Failed unittest modules: " + ($failedModules -join ", "))
            exit 1
          }
          Write-Output "All $($testFiles.Count) unittest modules passed in isolated processes."

      - name: Upload unittest log on failure
        if: always() && steps.full-tests.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unittest-python-${{ matrix.python-version }}-failure
          path: test-results/*.log
          if-no-files-found: error
          retention-days: 7

  release-preflight:
    name: Windows release preflight without signing secrets
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      OPENADB_VERSION: "3.1.0"
      PYTHON_VERSION: "3.12.10"
      PYTHONHASHSEED: "1"
      OPENADB_SPEC_SHA256: d2d9607b1356ac241afc038f2763a3e1f02479a01ebbc75f06155ec9a2d0f427
      PLATFORM_TOOLS_VERSION: "37.0.0"
      PLATFORM_TOOLS_ARCHIVE: "platform-tools_r37.0.0-win.zip"
      PLATFORM_TOOLS_ARCHIVE_SHA1: "f29bfb58d0d6f9a57d7dbcba6cc259f9ca6f58f1"
      PLATFORM_TOOLS_ARCHIVE_SHA256: "4fe305812db074cea32903a489d061eb4454cbc90a49e8fea677f4b7af764918"

    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact x64 release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          architecture: x64

      - name: Validate immutable release-preflight build context
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $sourceCommit = ([string]$env:GITHUB_SHA).Trim().ToLowerInvariant()
          $checkedOutCommit = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $runtime = (& python -c "import json, platform, struct; print(json.dumps({'version': platform.python_version(), 'architecture': platform.machine(), 'pointer_bits': struct.calcsize('P') * 8}))") | ConvertFrom-Json
          $specSha256 = (Get-FileHash -LiteralPath "OpenADB.spec" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceCommit -cnotmatch "^[0-9a-f]{40}$" -or
              $checkedOutCommit -cne $sourceCommit -or
              [string]$env:RUNNER_ARCH -ne "X64" -or
              [string]$runtime.version -ne $env:PYTHON_VERSION -or
              [string]$runtime.architecture -ne "AMD64" -or
              [int]$runtime.pointer_bits -ne 64 -or
              $specSha256 -ne $env:OPENADB_SPEC_SHA256) {
            throw "The release preflight is not running from the reviewed x64 source context."
          }
          $sourceDateEpoch = (& git show -s --format=%ct $sourceCommit).Trim()
          $parsedSourceDateEpoch = [long]0
          if ($LASTEXITCODE -ne 0 -or
              -not [long]::TryParse($sourceDateEpoch, [ref]$parsedSourceDateEpoch) -or
              $parsedSourceDateEpoch -le 0 -or
              $parsedSourceDateEpoch -gt [uint32]::MaxValue) {
            throw "The immutable source timestamp could not be derived."
          }
          "SOURCE_DATE_EPOCH=$sourceDateEpoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install exact hashed release dependencies
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $releaseVenv = Join-Path $env:RUNNER_TEMP "openadb-ci-release-venv-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv --clear $releaseVenv
          if ($LASTEXITCODE -ne 0) { throw "Clean release virtual environment creation failed." }
          $releasePython = Join-Path $releaseVenv "Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $releasePython -PathType Leaf)) {
            throw "The clean release virtual environment has no Python executable."
          }
          $releasePythonVersion = (& $releasePython -c "import platform; print(platform.python_version())").Trim()
          if ($LASTEXITCODE -ne 0 -or $releasePythonVersion -ne $env:PYTHON_VERSION) {
            throw "The clean release virtual environment does not use Python $env:PYTHON_VERSION."
          }

          & $releasePython -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --force-reinstall -r requirements-bootstrap-win-py312.lock
          if ($LASTEXITCODE -ne 0) { throw "Hashed bootstrap installation failed." }
          & $releasePython tools/verify_release_dependencies.py --phase bootstrap --lock requirements-bootstrap-win-py312.lock
          if ($LASTEXITCODE -ne 0) { throw "Hashed bootstrap verification failed." }
          & $releasePython -m pip check
          if ($LASTEXITCODE -ne 0) { throw "The hashed bootstrap environment is inconsistent." }
          & $releasePython -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --no-deps --no-build-isolation --force-reinstall -r requirements-build-win-py312.lock
          if ($LASTEXITCODE -ne 0) { throw "Hashed release installation failed." }
          & $releasePython -m pip check
          if ($LASTEXITCODE -ne 0) { throw "The release dependency environment is inconsistent." }
          & $releasePython tools/verify_release_dependencies.py --phase build --lock requirements-build-win-py312.lock --bootstrap-lock requirements-bootstrap-win-py312.lock --requirements requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "The release environment drifted from its reviewed hash locks." }
          $releaseScripts = Split-Path -Parent $releasePython
          $releaseScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$releaseVenv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENADB_RELEASE_PYTHON=$releasePython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download checksum-pinned Platform Tools
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $archivePath = Join-Path $env:RUNNER_TEMP $env:PLATFORM_TOOLS_ARCHIVE
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/$env:PLATFORM_TOOLS_ARCHIVE" -OutFile $archivePath -MaximumRetryCount 3 -RetryIntervalSec 5
          $actualSha1 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA1).Hash.ToLowerInvariant()
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha1 -ne $env:PLATFORM_TOOLS_ARCHIVE_SHA1 -or
              $actualSha256 -ne $env:PLATFORM_TOOLS_ARCHIVE_SHA256) {
            throw "Platform Tools archive checksum mismatch."
          }
          $sdkRoot = Join-Path $env:RUNNER_TEMP "openadb-ci-sdk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $sdkRoot -ErrorAction Stop | Out-Null
          Expand-Archive -LiteralPath $archivePath -DestinationPath $sdkRoot
          $toolsRoot = Join-Path $sdkRoot "platform-tools"
          foreach ($requiredFile in @(
              "adb.exe", "fastboot.exe", "AdbWinApi.dll", "AdbWinUsbApi.dll",
              "libwinpthread-1.dll", "NOTICE.txt"
            )) {
            if (-not (Test-Path -LiteralPath (Join-Path $toolsRoot $requiredFile) -PathType Leaf)) {
              throw "Pinned Platform Tools is missing $requiredFile."
            }
          }
          "OPENADB_PLATFORM_TOOLS_ROOT=$toolsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require two identical clean PyInstaller builds
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $activePython = (& python -c "import os, sys; print(os.path.abspath(sys.executable))").Trim()
          $expectedPython = [System.IO.Path]::GetFullPath([string]$env:OPENADB_RELEASE_PYTHON)
          if ($LASTEXITCODE -ne 0 -or
              -not [string]::Equals(
                [System.IO.Path]::GetFullPath($activePython),
                $expectedPython,
                [System.StringComparison]::OrdinalIgnoreCase
              )) {
            throw "The release preflight did not retain its verified virtual environment."
          }
          python -m PyInstaller --clean --noconfirm --distpath dist-preflight-1 --workpath build-preflight-1 OpenADB.spec
          if ($LASTEXITCODE -ne 0) { throw "The first release preflight build failed." }
          python -m PyInstaller --clean --noconfirm --distpath dist-preflight-2 --workpath build-preflight-2 OpenADB.spec
          if ($LASTEXITCODE -ne 0) { throw "The second release preflight build failed." }
          $filename = "OpenADB-$env:OPENADB_VERSION.exe"
          $first = Join-Path "dist-preflight-1" $filename
          $second = Join-Path "dist-preflight-2" $filename
          foreach ($candidate in @($first, $second)) {
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf) -or
                (Get-Item -LiteralPath $candidate).Length -le 0) {
              throw "A release preflight build did not produce the expected non-empty EXE."
            }
          }
          $firstHash = (Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash.ToLowerInvariant()
          $secondHash = (Get-FileHash -LiteralPath $second -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($firstHash -ne $secondHash) {
            throw "The two release preflight builds differ byte-for-byte."
          }
          $archiveEntries = & python -m PyInstaller.utils.cliutils.archive_viewer -l -b $first 2>&1
          if ($LASTEXITCODE -ne 0) { throw "The preflight one-file archive could not be inspected." }
          $archiveText = (($archiveEntries -join "`n") -replace "\\", "/")
          foreach ($entry in @(
              "LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_SOURCES.md",
              "platform-tools/adb.exe", "platform-tools/fastboot.exe",
              "platform-tools/AdbWinApi.dll", "platform-tools/AdbWinUsbApi.dll",
              "platform-tools/libwinpthread-1.dll",
              "platform-tools/NOTICE.txt",
              "openadb/resources/acbridge/ACBridge-$env:OPENADB_VERSION.apk",
              "PySide6/Qt6Pdf.dll", "PySide6/plugins/imageformats/qpdf.dll",
              "libcrypto-3.dll", "libssl-3.dll",
              "python312.dll"
            )) {
            if ($archiveText -notmatch [regex]::Escape($entry)) {
              throw "The release preflight EXE is missing $entry."
            }
          }
          foreach ($entry in @(
              "PySide6/Qt6WebEngineCore.dll",
              "PySide6/Qt6WebEngineQuick.dll",
              "PySide6/Qt6WebEngineWidgets.dll",
              "PySide6/QtWebEngineCore.pyd",
              "PySide6/QtWebEngineQuick.pyd",
              "PySide6/QtWebEngineWidgets.pyd"
            )) {
            if ($archiveText -match [regex]::Escape($entry)) {
              throw "The release preflight EXE contains an unreviewed browser payload: $entry"
            }
          }
