name: Windows release build

on:
  workflow_call:
    inputs:
      approved_acbridge_artifact_name:
        description: Exact approval-gated ACBridge artifact from this release run.
        required: true
        type: string
      approved_acbridge_apk_sha256:
        description: SHA-256 reported by independent ACBridge verification.
        required: true
        type: string
      approved_acbridge_signer_sha256:
        description: Single signer SHA-256 reported by independent ACBridge verification.
        required: true
        type: string
    outputs:
      artifact_name:
        description: Exact unsigned release bundle produced by this build.
        value: ${{ jobs.build.outputs.artifact_name }}
      artifact_id:
        description: Immutable GitHub artifact ID of the unsigned release bundle.
        value: ${{ jobs.build.outputs.artifact_id }}
      signpath_artifact_name:
        description: Exact one-file GitHub artifact eligible for SignPath submission.
        value: ${{ jobs.build.outputs.signpath_artifact_name }}
      signpath_artifact_id:
        description: Immutable GitHub artifact ID eligible for SignPath submission.
        value: ${{ jobs.build.outputs.signpath_artifact_id }}
      filename:
        description: Explicitly unsigned release-candidate filename.
        value: ${{ jobs.build.outputs.filename }}
      sha256:
        description: SHA-256 digest of the published EXE.
        value: ${{ jobs.build.outputs.sha256 }}
      signed:
        description: Always false; signing is isolated in the protected caller workflow.
        value: ${{ jobs.build.outputs.signed }}
permissions:
  actions: read
  contents: read

concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  OPENADB_VERSION: "3.1.0"
  PYTHON_VERSION: "3.12.10"
  PYTHONHASHSEED: "1"
  OPENADB_SPEC_SHA256: d2d9607b1356ac241afc038f2763a3e1f02479a01ebbc75f06155ec9a2d0f427
  PLATFORM_TOOLS_VERSION: "37.0.0"
  PLATFORM_TOOLS_ARCHIVE: "platform-tools_r37.0.0-win.zip"
  PLATFORM_TOOLS_ARCHIVE_SHA1: "f29bfb58d0d6f9a57d7dbcba6cc259f9ca6f58f1"
  PLATFORM_TOOLS_ARCHIVE_SHA256: "4fe305812db074cea32903a489d061eb4454cbc90a49e8fea677f4b7af764918"
  ANDROID_BUILD_TOOLS_VERSION: "37.0.0"

jobs:
  build:
    name: Build and verify one-file EXE
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.release_status.outputs.artifact_name }}
      artifact_id: ${{ steps.upload_release_bundle.outputs.artifact-id }}
      signpath_artifact_name: ${{ steps.signpath_input.outputs.artifact_name }}
      signpath_artifact_id: ${{ steps.upload_signpath_input.outputs.artifact-id }}
      filename: ${{ steps.release_status.outputs.filename }}
      sha256: ${{ steps.release_status.outputs.sha256 }}
      signed: ${{ steps.release_status.outputs.signed }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: x64

      - name: Validate release context and metadata
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -ne "refs/tags/v$env:OPENADB_VERSION") {
            throw "Tag builds are restricted to v$env:OPENADB_VERSION."
          }

          $sourceCommit = ([string]$env:GITHUB_SHA).Trim().ToLowerInvariant()
          if ($sourceCommit -cnotmatch "^[0-9a-f]{40}$") {
            throw "GITHUB_SHA is not an exact lowercase commit SHA."
          }
          $checkedOutCommit = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $checkedOutCommit -cne $sourceCommit) {
            throw "The checked-out release source does not match GITHUB_SHA."
          }
          if ([string]$env:RUNNER_ARCH -ne "X64") {
            throw "The release build requires the X64 GitHub runner architecture."
          }

          $metadataJson = & python -c "import json; from openadb.version import ACBRIDGE_APK_FILENAME, ACBRIDGE_PACKAGE, ACBRIDGE_VERSION_CODE, RELEASE_EXE_FILENAME, VERSION; print(json.dumps({'version': VERSION, 'release_exe': RELEASE_EXE_FILENAME, 'acbridge_apk': ACBRIDGE_APK_FILENAME, 'acbridge_package': ACBRIDGE_PACKAGE, 'acbridge_version_code': ACBRIDGE_VERSION_CODE}))"
          if ($LASTEXITCODE -ne 0) {
            throw "OpenADB release metadata could not be imported."
          }
          $metadata = $metadataJson | ConvertFrom-Json
          if ($metadata.version -ne $env:OPENADB_VERSION) {
            throw "Expected OpenADB $env:OPENADB_VERSION, found $($metadata.version)."
          }
          if ($metadata.release_exe -ne "OpenADB-$env:OPENADB_VERSION.exe") {
            throw "Unexpected release EXE name: $($metadata.release_exe)"
          }
          if ($metadata.acbridge_apk -ne "ACBridge-$env:OPENADB_VERSION.apk") {
            throw "Unexpected ACBridge APK name: $($metadata.acbridge_apk)"
          }

          $runtimeJson = & python -c "import json, platform, struct; print(json.dumps({'architecture': platform.machine(), 'pointer_bits': struct.calcsize('P') * 8}))"
          if ($LASTEXITCODE -ne 0) {
            throw "Python runtime architecture could not be inspected."
          }
          $runtime = $runtimeJson | ConvertFrom-Json
          if ([string]$runtime.architecture -ne "AMD64" -or [int]$runtime.pointer_bits -ne 64) {
            throw "The release build requires native 64-bit AMD64 Python."
          }
          if ($env:PYTHONHASHSEED -ne "1") {
            throw "The release build requires PYTHONHASHSEED=1."
          }

          $sourceDateEpoch = (& git show -s --format=%ct $sourceCommit).Trim()
          $parsedSourceDateEpoch = [long]0
          if ($LASTEXITCODE -ne 0 -or
              -not [long]::TryParse($sourceDateEpoch, [ref]$parsedSourceDateEpoch) -or
              $parsedSourceDateEpoch -le 0 -or
              $parsedSourceDateEpoch -gt [uint32]::MaxValue) {
            throw "The immutable source commit timestamp could not be resolved."
          }
          "SOURCE_DATE_EPOCH=$sourceDateEpoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENADB_BUILD_ARCHITECTURE=$($runtime.architecture)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENADB_BUILD_POINTER_BITS=$($runtime.pointer_bits)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download approval-gated ACBridge from this release run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.approved_acbridge_artifact_name }}
          path: approved-acbridge

      - name: Validate and stage the approved ACBridge bytes
        env:
          APPROVED_ARTIFACT_NAME: ${{ inputs.approved_acbridge_artifact_name }}
          APPROVED_APK_SHA256: ${{ inputs.approved_acbridge_apk_sha256 }}
          APPROVED_SIGNER_SHA256: ${{ inputs.approved_acbridge_signer_sha256 }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REF_TYPE -ne "tag" -or
              $env:GITHUB_REF -ne "refs/tags/v$env:OPENADB_VERSION") {
            throw "The Windows release build requires the exact v$env:OPENADB_VERSION tag."
          }
          $targetSha = $env:GITHUB_SHA.ToLowerInvariant()
          $runId = [long]$env:GITHUB_RUN_ID
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$runId"
          $approvedRoot = Join-Path $env:GITHUB_WORKSPACE "approved-acbridge"

          $statusPath = Join-Path $approvedRoot "ACBRIDGE_BUILD_STATUS.json"
          if (-not (Test-Path -LiteralPath $statusPath -PathType Leaf)) {
            throw "The approved ACBridge artifact has no build status."
          }
          $status = Get-Content -LiteralPath $statusPath -Raw -Encoding utf8 |
            ConvertFrom-Json
          $expectedKeys = @(
            "apk_filename",
            "apk_sha256",
            "package",
            "signature_schemes",
            "signer_sha256",
            "source_commit",
            "source_ref",
            "unsigned_sha256",
            "version_code",
            "version_name"
          )
          $actualKeys = @($status.PSObject.Properties.Name)
          if (@(Compare-Object -CaseSensitive $expectedKeys $actualKeys).Count -ne 0) {
            throw "The approved ACBridge build status schema is invalid."
          }

          $sourceJson = & python -c "import json; from openadb.version import ACBRIDGE_APK_FILENAME, ACBRIDGE_PACKAGE, ACBRIDGE_SIGNER_SHA256, ACBRIDGE_VERSION_CODE, VERSION; print(json.dumps({'apk_filename': ACBRIDGE_APK_FILENAME, 'package': ACBRIDGE_PACKAGE, 'signer_sha256': ACBRIDGE_SIGNER_SHA256, 'version_code': ACBRIDGE_VERSION_CODE, 'version_name': VERSION}))"
          if ($LASTEXITCODE -ne 0) {
            throw "The canonical ACBridge metadata could not be imported."
          }
          $source = $sourceJson | ConvertFrom-Json
          if ([string]$status.source_commit -ne $targetSha -or
              [string]$status.source_ref -ne $env:GITHUB_REF -or
              [string]$status.apk_filename -ne [string]$source.apk_filename -or
              [string]$status.package -ne [string]$source.package -or
              [string]$status.version_name -ne [string]$source.version_name -or
              [int]$status.version_code -ne [int]$source.version_code -or
              [string]$status.signer_sha256 -ne [string]$source.signer_sha256 -or
              [string]$status.signer_sha256 -ne $env:APPROVED_SIGNER_SHA256 -or
              [string]$status.apk_sha256 -notmatch "^[0-9a-f]{64}$" -or
              [string]$status.apk_sha256 -ne $env:APPROVED_APK_SHA256 -or
              [string]$status.unsigned_sha256 -notmatch "^[0-9a-f]{64}$" -or
              [string]$env:APPROVED_ARTIFACT_NAME -notmatch "^acbridge-release-verified-$targetSha-$env:GITHUB_RUN_ID-[1-9][0-9]*$" -or
              @(Compare-Object -CaseSensitive @("v1", "v2", "v3") @($status.signature_schemes)).Count -ne 0) {
            throw "The approved ACBridge artifact does not match this exact source tag."
          }

          $approvedApk = Join-Path $approvedRoot ([string]$status.apk_filename)
          $expectedFiles = @([string]$status.apk_filename, "ACBRIDGE_BUILD_STATUS.json")
          $actualFiles = @(
            Get-ChildItem -LiteralPath $approvedRoot -File -Recurse -Force |
              ForEach-Object {
                [IO.Path]::GetRelativePath($approvedRoot, $_.FullName).Replace("\", "/")
              }
          )
          $unexpectedDirectories = @(
            Get-ChildItem -LiteralPath $approvedRoot -Directory -Recurse -Force
          )
          if (@(Compare-Object -CaseSensitive $expectedFiles $actualFiles).Count -ne 0 -or
              $unexpectedDirectories.Count -ne 0 -or
              -not (Test-Path -LiteralPath $approvedApk -PathType Leaf) -or
              (Get-Item -LiteralPath $approvedApk).Length -le 0) {
            throw "The approved ACBridge artifact has missing or unexpected files."
          }
          $approvedHash = (
            Get-FileHash -LiteralPath $approvedApk -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($approvedHash -ne [string]$status.apk_sha256) {
            throw "The approved ACBridge APK does not match its signed build status."
          }

          $bridgeRoot = Join-Path $env:GITHUB_WORKSPACE "openadb/resources/acbridge"
          $versionedApk = Join-Path $bridgeRoot ([string]$status.apk_filename)
          $compatibleApk = Join-Path $bridgeRoot "ACBridge.apk"
          Copy-Item -LiteralPath $approvedApk -Destination $versionedApk -Force -ErrorAction Stop
          Copy-Item -LiteralPath $approvedApk -Destination $compatibleApk -Force -ErrorAction Stop
          foreach ($publishedApk in @($versionedApk, $compatibleApk)) {
            $publishedHash = (
              Get-FileHash -LiteralPath $publishedApk -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if ($publishedHash -ne $approvedHash) {
              throw "The approved ACBridge bytes were not published consistently into the build workspace."
            }
          }

          "OPENADB_ACBRIDGE_APPROVAL_ARTIFACT_NAME=$env:APPROVED_ARTIFACT_NAME" >> $env:GITHUB_ENV
          "OPENADB_ACBRIDGE_APPROVAL_RUN_ID=$runId" >> $env:GITHUB_ENV
          "OPENADB_ACBRIDGE_APPROVAL_RUN_URL=$runUrl" >> $env:GITHUB_ENV
          "OPENADB_ACBRIDGE_APPROVAL_SOURCE_REF=$env:GITHUB_REF" >> $env:GITHUB_ENV
          "OPENADB_ACBRIDGE_APPROVAL_UNSIGNED_SHA256=$([string]$status.unsigned_sha256)" >> $env:GITHUB_ENV
          "OPENADB_ACBRIDGE_APPROVED_APK_SHA256=$approvedHash" >> $env:GITHUB_ENV

      - name: Install exact Android APK verification tools
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $sdkRoot = if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) {
            $env:ANDROID_SDK_ROOT
          } else {
            $env:ANDROID_HOME
          }
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) {
            throw "The GitHub-hosted runner did not expose an Android SDK root."
          }
          $sdkManager = Get-ChildItem `
            -LiteralPath (Join-Path $sdkRoot "cmdline-tools") `
            -Filter "sdkmanager.bat" `
            -File `
            -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $sdkManager) {
            throw "sdkmanager.bat was not found in the hosted Android SDK."
          }
          & $sdkManager.FullName `
            "--sdk_root=$sdkRoot" `
            "build-tools;$env:ANDROID_BUILD_TOOLS_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "The exact Android APK verification tools could not be installed."
          }
          $buildTools = Join-Path $sdkRoot "build-tools\$env:ANDROID_BUILD_TOOLS_VERSION"
          foreach ($path in @(
              (Join-Path $buildTools "aapt.exe"),
              (Join-Path $buildTools "zipalign.exe"),
              (Join-Path $buildTools "lib\apksigner.jar")
            )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "The exact Android Build Tools installation is incomplete: $path"
            }
          }

      - name: Install pinned build dependencies
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $actualPythonVersion = (& python -c "import platform; print(platform.python_version())").Trim()
          if ($LASTEXITCODE -ne 0 -or $actualPythonVersion -ne $env:PYTHON_VERSION) {
            throw "Expected Python $env:PYTHON_VERSION, found '$actualPythonVersion'."
          }

          python -m pip install `
            --disable-pip-version-check `
            --no-cache-dir `
            --require-hashes `
            --no-deps `
            --force-reinstall `
            -r requirements-bootstrap-win-py312.lock
          if ($LASTEXITCODE -ne 0) {
            throw "Hashed release bootstrap installation failed."
          }

          python tools/verify_release_dependencies.py `
            --phase bootstrap `
            --lock requirements-bootstrap-win-py312.lock
          if ($LASTEXITCODE -ne 0) {
            throw "The build bootstrap does not exactly match its reviewed hash lock."
          }

          python -m pip install `
            --disable-pip-version-check `
            --no-cache-dir `
            --require-hashes `
            --no-deps `
            --no-build-isolation `
            --force-reinstall `
            -r requirements-build-win-py312.lock
          if ($LASTEXITCODE -ne 0) {
            throw "Hashed Windows release dependency installation failed."
          }

          python -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "The hashed Windows release environment is inconsistent."
          }

          python tools/verify_release_dependencies.py `
            --phase build `
            --lock requirements-build-win-py312.lock `
            --bootstrap-lock requirements-bootstrap-win-py312.lock `
            --requirements requirements-build.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Installed distributions do not exactly match the reviewed hash lock."
          }

      - name: Validate packaged release metadata
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          python -m unittest -q `
            tests.test_version_metadata `
            tests.test_acbridge_signing `
            tests.test_platform_tools_packaging `
            tests.test_release_dependency_lock `
            tests.test_release_legal_files
          if ($LASTEXITCODE -ne 0) {
            throw "Release metadata validation failed."
          }

          python tools/verify_acbridge_apk.py `
            "openadb/resources/acbridge/ACBridge-$env:OPENADB_VERSION.apk"
          if ($LASTEXITCODE -ne 0) {
            throw "The bundled ACBridge APK failed independent signer verification."
          }

      - name: Download pinned Android Platform Tools
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $archivePath = Join-Path $env:RUNNER_TEMP $env:PLATFORM_TOOLS_ARCHIVE
          $downloadUrl = "https://dl.google.com/android/repository/$env:PLATFORM_TOOLS_ARCHIVE"
          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $archivePath `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 5

          $actualSha1 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA1).Hash.ToLowerInvariant()
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha1 -ne $env:PLATFORM_TOOLS_ARCHIVE_SHA1 -or
              $actualSha256 -ne $env:PLATFORM_TOOLS_ARCHIVE_SHA256) {
            Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
            throw "Android Platform Tools archive checksum mismatch."
          }

          $sdkRoot = Join-Path $env:RUNNER_TEMP "openadb-android-sdk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $sdkRoot -ErrorAction Stop | Out-Null
          Expand-Archive -LiteralPath $archivePath -DestinationPath $sdkRoot
          $toolsRoot = Join-Path $sdkRoot "platform-tools"
          foreach ($requiredFile in @(
              "adb.exe",
              "fastboot.exe",
              "AdbWinApi.dll",
              "AdbWinUsbApi.dll",
              "libwinpthread-1.dll",
              "NOTICE.txt"
            )) {
            if (-not (Test-Path -LiteralPath (Join-Path $toolsRoot $requiredFile) -PathType Leaf)) {
              throw "Pinned Platform Tools is missing $requiredFile."
            }
          }

          $adbVersion = (& (Join-Path $toolsRoot "adb.exe") version 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $adbVersion -notmatch "Version $([regex]::Escape($env:PLATFORM_TOOLS_VERSION))") {
            throw "adb.exe does not report the pinned Platform Tools version."
          }
          $fastbootVersion = (& (Join-Path $toolsRoot "fastboot.exe") --version 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $fastbootVersion -notmatch $([regex]::Escape($env:PLATFORM_TOOLS_VERSION))) {
            throw "fastboot.exe does not report the pinned Platform Tools version."
          }

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENADB_PLATFORM_TOOLS_ROOT=$toolsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build one-file Windows executable
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $firstDist = Join-Path $env:GITHUB_WORKSPACE "dist-repro-1"
          $firstWork = Join-Path $env:GITHUB_WORKSPACE "build-repro-1"
          $secondDist = Join-Path $env:GITHUB_WORKSPACE "dist-repro-2"
          $secondWork = Join-Path $env:GITHUB_WORKSPACE "build-repro-2"
          python -m PyInstaller --clean --noconfirm --distpath $firstDist --workpath $firstWork OpenADB.spec
          if ($LASTEXITCODE -ne 0) {
            throw "The first clean PyInstaller build failed."
          }

          python -m PyInstaller --clean --noconfirm --distpath $secondDist --workpath $secondWork OpenADB.spec
          if ($LASTEXITCODE -ne 0) {
            throw "The second clean PyInstaller build failed."
          }

          $filename = "OpenADB-$env:OPENADB_VERSION.exe"
          $firstExe = Join-Path $firstDist $filename
          $secondExe = Join-Path $secondDist $filename
          foreach ($candidate in @($firstExe, $secondExe)) {
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf) -or
                (Get-Item -LiteralPath $candidate).Length -le 0) {
              throw "A clean PyInstaller build did not create the expected non-empty one-file EXE."
            }
          }
          $firstHash = (Get-FileHash -LiteralPath $firstExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $secondHash = (Get-FileHash -LiteralPath $secondExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($firstHash -ne $secondHash) {
            throw "The two clean PyInstaller builds are not byte-for-byte reproducible."
          }

          $canonicalDist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Path $canonicalDist -Force | Out-Null
          $exePath = Join-Path $canonicalDist $filename
          Copy-Item -LiteralPath $firstExe -Destination $exePath
          $canonicalFiles = @(Get-ChildItem -LiteralPath $canonicalDist -File -Force)
          $canonicalDirectories = @(Get-ChildItem -LiteralPath $canonicalDist -Directory -Force)
          if ($canonicalFiles.Count -ne 1 -or
              $canonicalFiles[0].Name -ne $filename -or
              $canonicalDirectories.Count -ne 0 -or
              (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $firstHash) {
            throw "The canonical PyInstaller output does not exactly match the verified first build."
          }
          "OPENADB_REPRODUCIBILITY_BUILD_COUNT=2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENADB_REPRODUCIBILITY_SHA256=$firstHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect bundled runtime payload
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $exePath = Join-Path $env:GITHUB_WORKSPACE "dist\OpenADB-$env:OPENADB_VERSION.exe"
          $archiveEntries = & python -m PyInstaller.utils.cliutils.archive_viewer -l -b $exePath 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "The PyInstaller one-file archive could not be inspected."
          }
          $archiveText = (($archiveEntries -join "`n") -replace "\\", "/")
          $requiredEntries = @(
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_SOURCES.md",
            "platform-tools/adb.exe",
            "platform-tools/fastboot.exe",
            "platform-tools/AdbWinApi.dll",
            "platform-tools/AdbWinUsbApi.dll",
            "platform-tools/libwinpthread-1.dll",
            "platform-tools/NOTICE.txt",
            "openadb/resources/acbridge/ACBridge-$env:OPENADB_VERSION.apk",
            "PySide6/Qt6Pdf.dll",
            "PySide6/plugins/imageformats/qpdf.dll",
            "libcrypto-3.dll",
            "libssl-3.dll",
            "python312.dll"
          )
          foreach ($entry in $requiredEntries) {
            if ($archiveText -notmatch [regex]::Escape($entry)) {
              throw "The one-file EXE is missing bundled payload: $entry"
            }
          }

          $forbiddenEntries = @(
            "PySide6/Qt6WebEngineCore.dll",
            "PySide6/Qt6WebEngineQuick.dll",
            "PySide6/Qt6WebEngineWidgets.dll",
            "PySide6/QtWebEngineCore.pyd",
            "PySide6/QtWebEngineQuick.pyd",
            "PySide6/QtWebEngineWidgets.pyd"
          )
          foreach ($entry in $forbiddenEntries) {
            if ($archiveText -match [regex]::Escape($entry)) {
              throw "The one-file EXE contains an unreviewed browser payload: $entry"
            }
          }

          $platformNoticePath = Join-Path $env:OPENADB_PLATFORM_TOOLS_ROOT "NOTICE.txt"
          $approvedApkPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "openadb\resources\acbridge\ACBridge-$env:OPENADB_VERSION.apk"
          @'
          from __future__ import annotations

          import sys
          from hashlib import sha256
          from pathlib import Path

          from PyInstaller.archive.readers import CArchiveReader


          root = Path.cwd()
          archive = CArchiveReader(sys.argv[1])
          platform_tools_notice = Path(sys.argv[2])
          approved_apk = Path(sys.argv[3])
          expected_apk_sha256 = sys.argv[4]
          expected_paths = [
              root / "LICENSE",
              root / "THIRD_PARTY_NOTICES.md",
              root / "THIRD_PARTY_SOURCES.md",
          ]
          expected_paths.extend(
              sorted(
                  (path for path in (root / "LICENSES").rglob("*") if path.is_file()),
                  key=lambda path: path.relative_to(root).as_posix(),
              )
          )
          if len(expected_paths) <= 3:
              raise SystemExit("The repository LICENSES directory is missing or empty.")

          archive_names: dict[str, str] = {}
          for raw_name in archive.toc:
              normalized = raw_name.replace("\\", "/")
              if normalized in archive_names:
                  raise SystemExit(f"Duplicate normalized archive entry: {normalized}")
              archive_names[normalized] = raw_name

          expected_names = {path.relative_to(root).as_posix() for path in expected_paths}
          actual_names = {
              name
              for name in archive_names
              if name in {"LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_SOURCES.md"}
              or name.startswith("LICENSES/")
          }
          if actual_names != expected_names:
              missing = sorted(expected_names - actual_names)
              unexpected = sorted(actual_names - expected_names)
              raise SystemExit(
                  f"Bundled legal file set mismatch; missing={missing}, unexpected={unexpected}"
              )

          for source in expected_paths:
              name = source.relative_to(root).as_posix()
              expected = source.read_bytes()
              actual = archive.extract(archive_names[name])
              if not expected or actual != expected:
                  raise SystemExit(f"Bundled legal document is empty or stale: {name}")

          platform_notice_data = platform_tools_notice.read_bytes()
          platform_notice_name = "platform-tools/NOTICE.txt"
          if (
              not platform_notice_data
              or platform_notice_name not in archive_names
              or archive.extract(archive_names[platform_notice_name]) != platform_notice_data
          ):
              raise SystemExit("Bundled Platform Tools NOTICE.txt is empty or stale.")

          approved_apk_data = approved_apk.read_bytes()
          approved_apk_name = approved_apk.relative_to(root).as_posix()
          if (
              not approved_apk_data
              or sha256(approved_apk_data).hexdigest() != expected_apk_sha256
              or approved_apk_name not in archive_names
              or archive.extract(archive_names[approved_apk_name]) != approved_apk_data
          ):
              raise SystemExit(
                  "The one-file EXE does not contain the exact approval-gated ACBridge APK."
              )
          '@ | python - `
            $exePath `
            $platformNoticePath `
            $approvedApkPath `
            $env:OPENADB_ACBRIDGE_APPROVED_APK_SHA256
          if ($LASTEXITCODE -ne 0) {
            throw "The one-file EXE does not contain the exact reviewed legal bundle and approved ACBridge APK."
          }

      - name: Smoke-test the EXE with a clean temporary profile
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $exePath = Join-Path $env:GITHUB_WORKSPACE "dist\OpenADB-$env:OPENADB_VERSION.exe"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "openadb-smoke-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $smokeRoot -ErrorAction Stop | Out-Null

          $env:USERPROFILE = $smokeRoot
          $env:HOME = $smokeRoot
          $env:APPDATA = Join-Path $smokeRoot "AppData\Roaming"
          $env:LOCALAPPDATA = Join-Path $smokeRoot "AppData\Local"
          $env:QT_OPENGL = "software"
          New-Item -ItemType Directory -Path $env:APPDATA -Force | Out-Null
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null

          $processName = [IO.Path]::GetFileNameWithoutExtension($exePath)
          $existingProcessIds = @(
            Get-Process -Name $processName -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Id }
          )
          $launcherProcess = $null
          $windowProcess = $null
          $smokeError = $null
          try {
            # A PyInstaller one-file launcher creates a child process that owns
            # the real window. Track both processes by this unique EXE path.
            $launcherProcess = Start-Process `
              -FilePath $exePath `
              -WorkingDirectory (Split-Path -Parent $exePath) `
              -PassThru

            $titleDeadline = [DateTime]::UtcNow.AddSeconds(45)
            $observedTitle = ""
            while ([DateTime]::UtcNow -lt $titleDeadline) {
              $candidateProcesses = @(
                Get-Process -Name $processName -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.Id -notin $existingProcessIds -and $_.Path -eq $exePath
                  }
              )
              foreach ($candidate in $candidateProcesses) {
                $candidate.Refresh()
                if ($candidate.MainWindowTitle) {
                  $windowProcess = $candidate
                  $observedTitle = $candidate.MainWindowTitle
                  break
                }
              }
              if ($observedTitle) {
                break
              }
              $launcherProcess.Refresh()
              if ($launcherProcess.HasExited -and $candidateProcesses.Count -eq 0) {
                throw "OpenADB exited during startup with code $($launcherProcess.ExitCode)."
              }
              Start-Sleep -Milliseconds 250
            }
            if ($observedTitle -ne "OpenADB $env:OPENADB_VERSION") {
              throw "Unexpected OpenADB window title: '$observedTitle'."
            }

            $settingsPath = Join-Path $smokeRoot "OpenADB\settings.json"
            $settingsReady = $false
            $settingsDeadline = [DateTime]::UtcNow.AddSeconds(20)
            while ([DateTime]::UtcNow -lt $settingsDeadline -and -not $settingsReady) {
              try {
                if (Test-Path -LiteralPath $settingsPath -PathType Leaf) {
                  $settings = Get-Content -LiteralPath $settingsPath -Raw | ConvertFrom-Json
                  $configuredTools = [string]$settings.platform_tools_path
                  $settingsReady = $configuredTools -match "[\\/]platform-tools$"
                }
              } catch {
                # Atomic settings replacement can briefly race this read; retry.
              }
              if (-not $settingsReady) {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $settingsReady) {
              throw "The clean profile did not select the bundled Platform Tools."
            }

            if ($null -eq $windowProcess -or -not $windowProcess.CloseMainWindow()) {
              throw "OpenADB did not accept a normal window-close request."
            }
            if (-not $launcherProcess.WaitForExit(20000)) {
              throw "OpenADB did not exit after its window was closed."
            }
            if ($launcherProcess.ExitCode -ne 0) {
              throw "OpenADB exited with code $($launcherProcess.ExitCode)."
            }
          } catch {
            $smokeError = $_
          } finally {
            $remainingProcesses = @(
              Get-Process -Name $processName -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Id -notin $existingProcessIds -and $_.Path -eq $exePath
                }
            )
            foreach ($remainingProcess in $remainingProcesses) {
              Stop-Process -Id $remainingProcess.Id -Force -ErrorAction SilentlyContinue
            }
            if ($null -ne $launcherProcess) {
              $launcherProcess.WaitForExit(5000) | Out-Null
            }
          }

          $crashLog = Join-Path $smokeRoot "OpenADB\logs\openadb-crash.log"
          if (Test-Path -LiteralPath $crashLog -PathType Leaf) {
            throw "The packaged application created a crash log during smoke testing: $crashLog"
          }
          if ($null -ne $smokeError) {
            throw $smokeError
          }

      - name: Prepare unsigned release candidate
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Path $releaseDir -ErrorAction Stop | Out-Null
          $builtExe = Join-Path $env:GITHUB_WORKSPACE "dist\OpenADB-$env:OPENADB_VERSION.exe"
          $unsignedExe = Join-Path $releaseDir "OpenADB-$env:OPENADB_VERSION-unsigned.exe"
          Copy-Item -LiteralPath $builtExe -Destination $unsignedExe

          $approvedApk = Join-Path `
            $env:GITHUB_WORKSPACE `
            "openadb\resources\acbridge\ACBridge-$env:OPENADB_VERSION.apk"
          if (-not (Test-Path -LiteralPath $approvedApk -PathType Leaf) -or
              (Get-Item -LiteralPath $approvedApk).Length -le 0) {
            throw "The approved ACBridge APK is missing from the verified build workspace."
          }
          $approvedHash = (
            Get-FileHash -LiteralPath $approvedApk -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($approvedHash -ne $env:OPENADB_ACBRIDGE_APPROVED_APK_SHA256) {
            throw "The ACBridge APK changed after approval and before release staging."
          }
          Copy-Item `
            -LiteralPath $approvedApk `
            -Destination (Join-Path $releaseDir "ACBridge-$env:OPENADB_VERSION.apk") `
            -ErrorAction Stop

          foreach ($legalName in @("LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_SOURCES.md")) {
            $source = Join-Path $env:GITHUB_WORKSPACE $legalName
            if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or
                (Get-Item -LiteralPath $source).Length -le 0) {
              throw "Required legal document is missing or empty: $legalName"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $releaseDir $legalName)
          }

          $licensesRoot = Join-Path $env:GITHUB_WORKSPACE "LICENSES"
          $licensesZip = Join-Path $releaseDir "LICENSES.zip"
          $platformNoticePath = Join-Path $env:OPENADB_PLATFORM_TOOLS_ROOT "NOTICE.txt"
          python tools/build_license_bundle.py `
            $licensesRoot `
            $platformNoticePath `
            $licensesZip
          if ($LASTEXITCODE -ne 0 -or
              -not (Test-Path -LiteralPath $licensesZip -PathType Leaf) -or
              (Get-Item -LiteralPath $licensesZip).Length -le 0) {
            throw "The deterministic LICENSES.zip bundle could not be created."
          }

          python tools/verify_license_bundle.py `
            $licensesRoot `
            $platformNoticePath `
            $licensesZip
          if ($LASTEXITCODE -ne 0) {
            throw "The independently verified LICENSES.zip bundle is invalid."
          }

      - name: Verify unsigned Authenticode boundary
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          $unsignedExe = Join-Path $releaseDir "OpenADB-$env:OPENADB_VERSION-unsigned.exe"
          if (-not (Test-Path -LiteralPath $unsignedExe -PathType Leaf) -or
              (Get-Item -LiteralPath $unsignedExe).Length -le 0) {
            throw "The unsigned release candidate is missing or empty."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $unsignedExe
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "The SignPath input unexpectedly contains an Authenticode signature."
          }

      - name: Write checksums and build status
        id: release_status
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          $signed = $false
          $filename = "OpenADB-$env:OPENADB_VERSION-unsigned.exe"
          $exePath = Join-Path $releaseDir $filename
          $releaseExecutables = @(Get-ChildItem -LiteralPath $releaseDir -Filter "*.exe" -File -Force)
          if ($releaseExecutables.Count -ne 1 -or -not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Release output must contain exactly one correctly named EXE."
          }

          $sha256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $checksumPaths = @(
            $exePath,
            (Join-Path $releaseDir "ACBridge-$env:OPENADB_VERSION.apk"),
            (Join-Path $releaseDir "LICENSE"),
            (Join-Path $releaseDir "THIRD_PARTY_NOTICES.md"),
            (Join-Path $releaseDir "THIRD_PARTY_SOURCES.md"),
            (Join-Path $releaseDir "LICENSES.zip")
          )
          $checksumLines = foreach ($path in $checksumPaths | Sort-Object { Split-Path -Leaf $_ }) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Checksummed release input is missing or empty: $path"
            }
            $item = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $releaseDir "SHA256SUMS.txt"),
            $checksumLines,
            $utf8NoBom
          )

          $sourceMetadataJson = & python -c "import json; from openadb.version import ACBRIDGE_APK_FILENAME, ACBRIDGE_PACKAGE, ACBRIDGE_SIGNER_SHA256, ACBRIDGE_VERSION_CODE, VERSION; print(json.dumps({'version': VERSION, 'apk_filename': ACBRIDGE_APK_FILENAME, 'package': ACBRIDGE_PACKAGE, 'signer_sha256': ACBRIDGE_SIGNER_SHA256, 'version_code': ACBRIDGE_VERSION_CODE}))"
          if ($LASTEXITCODE -ne 0) {
            throw "ACBridge metadata could not be read."
          }
          $sourceMetadata = $sourceMetadataJson | ConvertFrom-Json
          $acbridgeApkPath = Join-Path "openadb/resources/acbridge" $sourceMetadata.apk_filename
          if (-not (Test-Path -LiteralPath $acbridgeApkPath -PathType Leaf)) {
            throw "The verified ACBridge APK is missing while build status is being written."
          }
          $acbridgeApkSha256 = (
            Get-FileHash -LiteralPath $acbridgeApkPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $releasedAcbridgeApkPath = Join-Path $releaseDir $sourceMetadata.apk_filename
          if (-not (Test-Path -LiteralPath $releasedAcbridgeApkPath -PathType Leaf) -or
              (Get-Item -LiteralPath $releasedAcbridgeApkPath).Length -le 0 -or
              $acbridgeApkSha256 -ne $env:OPENADB_ACBRIDGE_APPROVED_APK_SHA256 -or
              (Get-FileHash -LiteralPath $releasedAcbridgeApkPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $acbridgeApkSha256 -or
              [string]$env:OPENADB_ACBRIDGE_APPROVAL_ARTIFACT_NAME -notmatch "^acbridge-release-verified-$($env:GITHUB_SHA.ToLowerInvariant())-$env:GITHUB_RUN_ID-[1-9][0-9]*$" -or
              [string]$env:OPENADB_ACBRIDGE_APPROVAL_RUN_ID -notmatch "^[1-9][0-9]*$" -or
              [string]$env:OPENADB_ACBRIDGE_APPROVAL_RUN_URL -ne "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:OPENADB_ACBRIDGE_APPROVAL_RUN_ID" -or
              [string]$env:OPENADB_ACBRIDGE_APPROVAL_SOURCE_REF -ne $env:GITHUB_REF -or
              [string]$env:OPENADB_ACBRIDGE_APPROVAL_UNSIGNED_SHA256 -notmatch "^[0-9a-f]{64}$") {
            throw "The approval-gated ACBridge provenance is missing or inconsistent."
          }
          $pythonVersion = (& python -c "import platform; print(platform.python_version())").Trim()
          if ($LASTEXITCODE -ne 0 -or $pythonVersion -ne $env:PYTHON_VERSION) {
            throw "Release status cannot attest the exact Python version."
          }
          $bootstrapLockSha256 = (
            Get-FileHash -LiteralPath "requirements-bootstrap-win-py312.lock" -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $buildLockSha256 = (
            Get-FileHash -LiteralPath "requirements-build-win-py312.lock" -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $specSha256 = (
            Get-FileHash -LiteralPath "OpenADB.spec" -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $sourceDateEpoch = [long]0
          if (-not [long]::TryParse([string]$env:SOURCE_DATE_EPOCH, [ref]$sourceDateEpoch) -or
              $sourceDateEpoch -le 0 -or
              [string]$env:OPENADB_BUILD_ARCHITECTURE -ne "AMD64" -or
              [string]$env:OPENADB_BUILD_POINTER_BITS -ne "64" -or
              [string]$env:PYTHONHASHSEED -ne "1" -or
              [string]$env:OPENADB_REPRODUCIBILITY_BUILD_COUNT -ne "2" -or
              $specSha256 -ne [string]$env:OPENADB_SPEC_SHA256 -or
              [string]$env:ImageOS -cnotmatch "^win[0-9]{2}$" -or
              [string]$env:ImageVersion -cnotmatch "^[^\x00-\x1f\x7f]{1,128}$" -or
              [string]$env:OPENADB_REPRODUCIBILITY_SHA256 -ne $sha256) {
            throw "Release build reproducibility metadata is missing or inconsistent."
          }
          $status = [ordered]@{
            version = $env:OPENADB_VERSION
            signed = $signed
            filename = $filename
            sha256 = $sha256
            source_commit = $env:GITHUB_SHA
            signing = [ordered]@{
              provider = "none"
              unsigned_sha256 = $sha256
            }
            platform_tools = [ordered]@{
              version = $env:PLATFORM_TOOLS_VERSION
              archive_sha1 = $env:PLATFORM_TOOLS_ARCHIVE_SHA1
              archive_sha256 = $env:PLATFORM_TOOLS_ARCHIVE_SHA256
            }
            python = [ordered]@{
              version = $pythonVersion
              bootstrap_lock_sha256 = $bootstrapLockSha256
              build_lock_sha256 = $buildLockSha256
            }
            build = [ordered]@{
              architecture = $env:OPENADB_BUILD_ARCHITECTURE
              pointer_bits = [int]$env:OPENADB_BUILD_POINTER_BITS
              python_hash_seed = [int]$env:PYTHONHASHSEED
              source_date_epoch = $sourceDateEpoch
              spec_sha256 = $specSha256
              runner_image_os = $env:ImageOS
              runner_image_version = $env:ImageVersion
              reproducibility_build_count = [int]$env:OPENADB_REPRODUCIBILITY_BUILD_COUNT
              reproducibility_sha256 = $env:OPENADB_REPRODUCIBILITY_SHA256
            }
            acbridge = [ordered]@{
              approval_artifact_name = $env:OPENADB_ACBRIDGE_APPROVAL_ARTIFACT_NAME
              approval_run_id = [long]$env:OPENADB_ACBRIDGE_APPROVAL_RUN_ID
              approval_run_url = $env:OPENADB_ACBRIDGE_APPROVAL_RUN_URL
              approval_workflow = "acbridge-release.yml"
              package = $sourceMetadata.package
              version_name = $sourceMetadata.version
              version_code = [int]$sourceMetadata.version_code
              apk_filename = $sourceMetadata.apk_filename
              apk_sha256 = $acbridgeApkSha256
              signer_sha256 = $sourceMetadata.signer_sha256
              signature_schemes = @("v1", "v2", "v3")
              source_ref = $env:OPENADB_ACBRIDGE_APPROVAL_SOURCE_REF
              unsigned_sha256 = $env:OPENADB_ACBRIDGE_APPROVAL_UNSIGNED_SHA256
            }
          }
          [IO.File]::WriteAllText(
            (Join-Path $releaseDir "BUILD_STATUS.json"),
            (($status | ConvertTo-Json -Depth 4) + "`n"),
            $utf8NoBom
          )

          $expectedReleaseFiles = @(
            $filename,
            "ACBridge-$env:OPENADB_VERSION.apk",
            "BUILD_STATUS.json",
            "LICENSE",
            "LICENSES.zip",
            "SHA256SUMS.txt",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_SOURCES.md"
          )
          $actualReleaseFiles = @(
            Get-ChildItem -LiteralPath $releaseDir -File -Force |
              Select-Object -ExpandProperty Name
          )
          $unexpectedReleaseDirectories = @(Get-ChildItem -LiteralPath $releaseDir -Directory -Force)
          if (@(Compare-Object $expectedReleaseFiles $actualReleaseFiles).Count -ne 0 -or
              $unexpectedReleaseDirectories.Count -ne 0) {
            throw "Release output has missing or unexpected files."
          }

          $artifactName = "OpenADB-$env:OPENADB_VERSION-windows-unsigned"
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "filename=$filename" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signed=$($signed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Define the exact SignPath input artifact
        id: signpath_input
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $artifactName = "openadb-signpath-input-$($env:GITHUB_SHA.ToLowerInvariant())-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Upload the exact one-file SignPath input artifact
        id: upload_signpath_input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.signpath_input.outputs.artifact_name }}
          path: release/OpenADB-3.1.0-unsigned.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload verified unsigned Windows release bundle
        id: upload_release_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release_status.outputs.artifact_name }}
          path: |
            release/*.exe
            release/ACBridge-*.apk
            release/LICENSE
            release/LICENSES.zip
            release/THIRD_PARTY_NOTICES.md
            release/THIRD_PARTY_SOURCES.md
            release/SHA256SUMS.txt
            release/BUILD_STATUS.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
